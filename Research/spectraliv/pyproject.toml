[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectraliv"
version = "0.1.0"
description = "Spectral (Jacobi/Tracy-Widom) calibration for weak-instrument testing and spectrally truncated IV estimation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running statistical validation tests",
]
testpaths = ["tests"]
